name: New spec
description: Propose a new API spec for the registry
labels: ["new-spec"]
body:
  - type: markdown
    attributes:
      value: |
        Just the provider name and a link to its docs is enough to get started — the discovery
        pipeline reads the real documentation to work out the rest (category, countries,
        capabilities). See [ATSS.md](../ATSS.md) for field rules and the spec lifecycle.

  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: e.g. Wave
    validations:
      required: true

  - type: input
    id: docs_url
    attributes:
      label: Provider docs URL
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: gotchas
    attributes:
      label: Known gotchas
      description: Optional — anything from real integration experience the automated extraction can't find in the docs alone.
      placeholder: |
        - The payment URL expires after 30 minutes.
        - Always verify status server-side before fulfilling an order.
    validations:
      required: false
