name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Detect which paths changed — used by security and deploy to skip when irrelevant
  changes:
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            specs:
              - 'specs/**'

  # Validate all specs (or changed ones on PR)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validator and spec-diff tests
        run: node --test scripts/validate.test.js scripts/spec-diff.test.js scripts/third-party.test.js
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - name: test_live.py tests (offline)
        run: python3 -m unittest discover -s scripts -p "test_live_test.py"
      - name: Validate changed specs (PR)
        if: github.event_name == 'pull_request'
        run: npm run validate:changed
      - name: Validate all specs (push to main)
        if: github.event_name == 'push'
        run: npm run validate
      - name: Trigger downstream redeploys
        if: github.event_name == 'push' && success()
        run: |
          echo "Dispatching specs-updated to afrotools/core ..."
          gh api repos/afrotools/core/dispatches \
            --method POST --field event_type=specs-updated
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}

  # Regenerate README providers table — only on push to main, after validate passes
  generate-readme:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.DISPATCH_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate README tables
        run: node scripts/generate-readme.js
      - name: Open PR if README changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          branch: chore/update-providers-table
          commit-message: "chore: update providers table"
          title: "chore: update providers table"
          body: "Auto-generated by the `generate-readme` CI job."
          labels: automated
      - name: Checkout afrotools/.github
        uses: actions/checkout@v6
        with:
          repository: afrotools/.github
          path: org-profile
          token: ${{ secrets.DISPATCH_TOKEN }}
      - name: Generate org profile table
        run: README_PATH=org-profile/profile/README.md node scripts/generate-readme.js
      - name: Open PR on afrotools/.github if changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          path: org-profile
          branch: chore/update-providers-table
          commit-message: "chore: update providers table"
          title: "chore: update providers table"
          body: "Auto-generated by the `generate-readme` CI job in afrotools/afrotools."
          labels: automated

  # Skills may only call tools the MCP server exposes (a skill once called a `list_specs` that never existed).
  # Keep MCP_TOOLS in sync with the tools registered in afrotools/core apps/mcp/src/index.ts.
  check-skill-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Skills only reference existing MCP tools
        run: |
          MCP_TOOLS="list_providers search_specs get_spec request_spec report_integration"
          USED=$(grep -rhoE 'afrotools\.[a-z_]+\(' plugin/skills | sed -E 's/afrotools\.([a-z_]+)\(/\1/' | sort -u)
          UNKNOWN=$(comm -23 <(echo "$USED") <(tr ' ' '\n' <<< "$MCP_TOOLS" | sort -u))
          if [ -n "$UNKNOWN" ]; then
            echo "❌  plugin/skills call MCP tools that don't exist: $UNKNOWN"
            grep -rnE "afrotools\.($(echo $UNKNOWN | tr ' ' '|'))\(" plugin/skills
            exit 1
          fi
          echo "✅  Skills reference only: $(echo $USED)"

  # Enforce plugin version bump when plugin/skills/** changes
  check-plugin-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require version bump when skills change
        run: |
          SKILLS_CHANGED=$(git diff --name-only origin/main...HEAD | grep '^plugin/skills/' || true)
          VERSION_CHANGED=$(git diff --name-only origin/main...HEAD | grep '^plugin/.claude-plugin/plugin.json' || true)

          if [ -n "$SKILLS_CHANGED" ] && [ -z "$VERSION_CHANGED" ]; then
            echo "❌  plugin/skills/ was modified but plugin/.claude-plugin/plugin.json was not updated."
            echo ""
            echo "Changed skill files:"
            echo "$SKILLS_CHANGED"
            echo ""
            echo "Bump the version in plugin/.claude-plugin/plugin.json before merging."
            echo "Users with a cached install will not get the new skill until the version changes."
            exit 1
          fi

          if [ -n "$SKILLS_CHANGED" ]; then
            VERSION=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
            echo "✅  plugin/skills/ changed — plugin/.claude-plugin/plugin.json updated (version: $VERSION)"
          else
            echo "✅  No plugin/skills/ changes — no version bump required."
          fi

  # A removed capability or field breaks the integrations built on it: the PR needs the "breaking"
  # label (ATSS.md § Compatibility policy). Labels are read when the job runs, so re-running it after
  # setting the label is enough (a re-run keeps the event's original payload).
  # The checkout is the PR merged into its base: compared with that base (HEAD^1), not with today's
  # main, so specs merged since do not show up as removed on a re-run. The base's spec-diff.js runs
  # (built-ins only), so a PR cannot edit the check it is judged by; the PR's own copy only while
  # the base has none (the PR that adds it).
  spec-diff:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Removed capabilities and fields need the breaking label
        run: |
          git show HEAD^1:scripts/spec-diff.js > "$RUNNER_TEMP/spec-diff.js" || cp scripts/spec-diff.js "$RUNNER_TEMP/spec-diff.js"
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx breaking; then
            node "$RUNNER_TEMP/spec-diff.js" HEAD^1 --allow-breaking
          else
            node "$RUNNER_TEMP/spec-diff.js" HEAD^1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  # Security scan + CodeQL — only when specs/** changed
  security:
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Security scan — changed specs (PR)
        if: github.event_name == 'pull_request'
        run: node scripts/validate.js --changed --security-only
      - name: Security scan — all specs (push to main)
        if: github.event_name == 'push'
        run: node scripts/validate.js --security-only
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
