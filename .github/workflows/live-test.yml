name: Live test

# Manual only — this hits real provider APIs (sandbox environments) with real
# credentials. Never run on push/PR: no automated trigger should be able to
# spend rate limit, create sandbox transactions, or leak a secret via a
# malicious PR from a fork.
#
# Credentials come from a GitHub Environment named after the provider slug
# (Settings → Environments → New environment), never from workflow_dispatch
# inputs — inputs are plain text, stored and visible in run history; on a
# public repo that's equivalent to publishing the credential.
#
# Onboarding a new sandbox provider is a repo-settings action, not a YAML
# edit:
#   1. Settings → Environments → New environment, named exactly the
#      provider's slug (e.g. "qosic")
#   2. Add a secret called LIVE_TEST_CREDENTIAL with the real value
#   3. If the provider's auth type is "basic", also add
#      LIVE_TEST_CREDENTIAL_SECONDARY
# scripts/ci_resolve_live_test_env.py reads live_test_fixtures.json +
# schema.json to figure out which env var name test_live.py actually needs
# (e.g. QOSIC_USERNAME) and exports the generic secret under that name —
# so this file never needs a provider-specific line added to it.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider slug — must have a matching GitHub Environment (see comments above)"
        required: true
        type: environment
      capability:
        description: "Only test this capability (optional)"
        required: false
        type: string

jobs:
  live-test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.provider }}
    env:
      INPUT_PROVIDER: ${{ inputs.provider }}
      INPUT_CAPABILITY: ${{ inputs.capability }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install certifi

      - name: Resolve which env var name(s) this provider needs
        id: resolve
        run: |
          mapfile -t names < <(python3 scripts/ci_resolve_live_test_env.py --provider "$INPUT_PROVIDER")
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::Could not resolve an env var name for provider '$INPUT_PROVIDER' — see the error above."
            exit 1
          fi
          echo "primary=${names[0]}" >> "$GITHUB_OUTPUT"
          if [ "${#names[@]}" -gt 1 ]; then
            echo "secondary=${names[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export the environment's credential under that name
        env:
          PRIMARY_NAME: ${{ steps.resolve.outputs.primary }}
          SECONDARY_NAME: ${{ steps.resolve.outputs.secondary }}
          PRIMARY_VALUE: ${{ secrets.LIVE_TEST_CREDENTIAL }}
          SECONDARY_VALUE: ${{ secrets.LIVE_TEST_CREDENTIAL_SECONDARY }}
        run: |
          if [ -z "$PRIMARY_VALUE" ]; then
            echo "::error::No LIVE_TEST_CREDENTIAL secret set on the '$INPUT_PROVIDER' Environment."
            exit 1
          fi
          echo "::add-mask::$PRIMARY_VALUE"
          echo "${PRIMARY_NAME}=${PRIMARY_VALUE}" >> "$GITHUB_ENV"
          if [ -n "$SECONDARY_NAME" ]; then
            if [ -z "$SECONDARY_VALUE" ]; then
              echo "::error::This provider's auth needs a second credential — set LIVE_TEST_CREDENTIAL_SECONDARY on the '$INPUT_PROVIDER' Environment."
              exit 1
            fi
            echo "::add-mask::$SECONDARY_VALUE"
            echo "${SECONDARY_NAME}=${SECONDARY_VALUE}" >> "$GITHUB_ENV"
          fi

      - name: Run scripts/test_live.py
        run: |
          if [ -n "$INPUT_CAPABILITY" ]; then
            python3 scripts/test_live.py --provider "$INPUT_PROVIDER" --capability "$INPUT_CAPABILITY"
          else
            python3 scripts/test_live.py --provider "$INPUT_PROVIDER"
          fi
